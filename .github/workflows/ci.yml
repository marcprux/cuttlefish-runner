name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build example app
        working-directory: example
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run instrumented tests on Cuttlefish
        id: cuttlefish
        uses: ./
        with:
          working-directory: example
          script: |
            adb devices -l
            ./gradlew connectedDebugAndroidTest

      - name: Check test results
        run: |
          results=$(find example/app/build/outputs/androidTest-results -name 'TEST-*.xml')
          test -n "$results"
          echo "$results" | xargs grep -h '<testsuite ' | tee /dev/stderr | grep -q 'tests="3" failures="0" errors="0"'
          echo "booted ${{ steps.cuttlefish.outputs.target }} build ${{ steps.cuttlefish.outputs.build-id }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: example/app/build/outputs/androidTest-results
          if-no-files-found: ignore
