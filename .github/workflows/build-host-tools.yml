# Builds the macOS host side of Cuttlefish and publishes it as a release:
#  - QEMU from facebookincubator/qemu-wearables
#  - cvd-host_package from AOSP with the facebookincubator/cuttlefish-wearables patches
# The action downloads these release assets on macOS runners.
name: build-host-tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the assets under
        required: true
        default: host-tools-1
      cuttlefish-wearables-ref:
        description: Commit of facebookincubator/cuttlefish-wearables
        default: 1dd3aa239e02cce10d79d80d68823181a64ce078
      qemu-wearables-ref:
        description: Commit of facebookincubator/qemu-wearables
        default: 5bcef396b9e1fed3da3f7c296dd3853ea1e0dc8a
      build-qemu:
        description: Build QEMU
        type: boolean
        default: true
      build-cvd:
        description: Build the cvd host package
        type: boolean
        default: true
      cvd-runner:
        description: Runner that builds the cvd host package
        default: macos-15-intel
      cvd-jobs:
        description: Parallel build jobs for the cvd host package
        default: '4'

permissions:
  contents: write

jobs:
  qemu:
    if: inputs.build-qemu
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install glib pixman libslirp dtc ninja meson pkgconf

      - name: Fetch QEMU
        run: |
          git init -q qemu-src
          cd qemu-src
          git remote add origin https://github.com/facebookincubator/qemu-wearables.git
          git fetch -q --depth 1 origin "${{ inputs.qemu-wearables-ref }}"
          git checkout -q FETCH_HEAD

      - name: Build QEMU
        run: |
          mkdir qemu-src/build
          cd qemu-src/build
          ../configure --target-list=aarch64-softmmu --prefix="$GITHUB_WORKSPACE/qemu" \
            --enable-slirp --enable-cocoa --enable-hvf --enable-tcg --enable-tools \
            --disable-docs --disable-werror --disable-guest-agent --disable-gnutls \
            --disable-nettle --disable-gcrypt --disable-sdl --disable-gtk --disable-curses \
            --disable-vnc-sasl --disable-vnc-jpeg --disable-png --disable-libusb \
            --disable-usb-redir --disable-capstone --disable-libssh --disable-curl \
            --disable-zstd --disable-lzo --disable-snappy --disable-bzip2 \
            --disable-libiscsi --disable-libnfs --disable-rbd --disable-glusterfs \
            --disable-smartcard --disable-spice --disable-opengl --disable-virglrenderer \
            --disable-brlapi --disable-vde --disable-jack
          ninja
          ninja install

      - name: Package QEMU
        run: |
          rm -f qemu/bin/qemu-system-aarch64-unsigned
          rm -rf qemu/include qemu/lib qemu/libexec qemu/share/applications qemu/share/icons
          find qemu/share/qemu -maxdepth 1 -type f -size +1000k ! -name '*aarch64*' ! -name '*arm*' -delete
          host-tools/bundle-dylibs.sh "$PWD/qemu" qemu-src/accel/hvf/entitlements.plist
          qemu/bin/qemu-system-aarch64 --version
          qemu/bin/qemu-system-aarch64 -accel help
          qemu/bin/qemu-img --version
          echo "${{ inputs.qemu-wearables-ref }}" > qemu/SOURCE_COMMIT
          cp qemu-src/COPYING qemu-src/LICENSE qemu/
          tar -czf qemu-darwin-arm64.tar.gz qemu
          ls -lh qemu-darwin-arm64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-darwin-arm64
          path: qemu-darwin-arm64.tar.gz
          compression-level: 0

  # The build takes longer than the six hours a hosted job may run, so it is
  # split into stages that run one after the other. A stage that runs out of
  # time hands its out directory to the next one as an artifact. Stages that
  # start after the package has been built do nothing.
  cvd:
    if: inputs.build-cvd
    runs-on: ${{ inputs.cvd-runner }}
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      matrix:
        stage: [1, 2, 3, 4, 5]
    env:
      AOSP: /Volumes/aosp/src
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ matrix.stage }}
      LAST_STAGE: 5
    steps:
      - name: Check earlier stages
        id: check
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          names="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name')"
          echo "$names"
          if echo "$names" | grep -qx cvd-host_package-darwin; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$names" | grep -qx cvd-out; then
            echo "resume=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.build == 'true'

      - name: Create case-sensitive volume
        if: steps.check.outputs.build == 'true'
        run: |
          # AOSP has file names that differ only in case. A volume in the boot
          # container shares its free space, unlike a disk image.
          container="$(diskutil info / | awk '/APFS Container:/ { print $NF }')"
          sudo diskutil apfs addVolume "$container" 'Case-sensitive APFS' aosp
          mount | grep /Volumes/aosp
          sudo chown "$USER" /Volumes/aosp
          df -h /Volumes/aosp
          mkdir -p "$AOSP"

      - name: Free disk space
        if: steps.check.outputs.build == 'true'
        run: host-tools/free-disk-space.sh

      - name: Fetch patches
        if: steps.check.outputs.build == 'true'
        run: |
          git init -q -b main "$HOME/cuttlefish-wearables"
          cd "$HOME/cuttlefish-wearables"
          git remote add origin https://github.com/facebookincubator/cuttlefish-wearables.git
          git fetch -q --depth 1 origin "${{ inputs.cuttlefish-wearables-ref }}"
          git reset -q --hard FETCH_HEAD

      - name: Sync AOSP
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          git config --global user.name "cuttlefish-runner"
          git config --global user.email "cuttlefish-runner@users.noreply.github.com"
          git config --global color.ui false
          cd "$AOSP"
          "$HOME/bin/repo" init -q -u "$HOME/cuttlefish-wearables" -b main -m minimal.xml --depth=1 < /dev/null
          for attempt in 1 2 3 4 5; do
            "$HOME/bin/repo" sync -c -j6 --no-tags --no-clone-bundle -q && break
            [ "$attempt" -lt 5 ] || exit 1
            df -h /Volumes/aosp
            sleep 60
          done
          df -h /Volumes/aosp

      - name: Apply patches
        if: steps.check.outputs.build == 'true'
        run: |
          "$HOME/cuttlefish-wearables/apply.sh" "$AOSP" | grep -v '^Applying: '
          # Every stage checks the sources out again. Giving them the same
          # modification times each time keeps the out directory of an
          # earlier stage up to date.
          cd "$AOSP"
          find . -path ./.repo -prune -o -print0 | xargs -0 touch -h -t 202601010000
          df -h /Volumes/aosp

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.build == 'true' && steps.check.outputs.resume == 'true'
        with:
          name: cvd-out
          path: /Volumes/aosp

      - name: Restore out directory
        if: steps.check.outputs.build == 'true' && steps.check.outputs.resume == 'true'
        run: |
          cd "$AOSP"
          command -v zstd > /dev/null || brew install zstd
          zstd -dc /Volumes/aosp/out.tar.zst | tar -xf -
          rm /Volumes/aosp/out.tar.zst
          du -sh out
          df -h /Volumes/aosp

      - name: Build cvd host package
        id: build
        if: steps.check.outputs.build == 'true'
        run: |
          xcodebuild -version
          ls -l /var/select/developer_dir
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          status=0
          host-tools/run-build.sh "$AOSP" "${{ inputs.cvd-jobs }}" "$((JOB_START + 280 * 60))" || status=$?
          if [ "$status" = 75 ] && [ "$STAGE" != "$LAST_STAGE" ]; then
            echo "result=continue" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 0 ]; then
            echo "result=done" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Save out directory
        if: steps.build.outputs.result == 'continue'
        run: |
          cd "$AOSP"
          du -sh out
          command -v zstd > /dev/null || brew install zstd
          tar -cf - out | zstd -q -T0 -3 -o /Volumes/aosp/out.tar.zst
          ls -lh /Volumes/aosp/out.tar.zst

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.result == 'continue'
        with:
          name: cvd-out
          path: /Volumes/aosp/out.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 2

      - name: Package
        if: steps.build.outputs.result == 'done'
        run: |
          cp "$AOSP/out/host/darwin-x86/cvd-host_package.tar.gz" cvd-host_package-darwin.tar.gz
          ls -lh cvd-host_package-darwin.tar.gz
          tar -tzf cvd-host_package-darwin.tar.gz | head -50
          tar -xzf cvd-host_package-darwin.tar.gz bin/launch_cvd bin/run_cvd && file bin/launch_cvd bin/run_cvd

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.result == 'done'
        with:
          name: cvd-host_package-darwin
          path: cvd-host_package-darwin.tar.gz
          compression-level: 0

      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p logs
          cp "$AOSP"/out/error.log "$AOSP"/out/soong.log "$AOSP"/out/verbose.log.gz logs/ 2> /dev/null || true
          tail -n 200 "$AOSP/out/error.log" 2> /dev/null || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ matrix.stage }}
          path: logs
          if-no-files-found: ignore

  release:
    needs: [qemu, cvd]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          ls -lh
          shasum -a 256 *.tar.gz | tee SHA256SUMS
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "macOS host tools for Cuttlefish.

          - QEMU: facebookincubator/qemu-wearables@${{ inputs.qemu-wearables-ref }}
          - cvd host package: AOSP android-16.0.0_r1 with facebookincubator/cuttlefish-wearables@${{ inputs.cuttlefish-wearables-ref }}"
          fi
          gh release upload "$TAG" *.tar.gz --clobber
